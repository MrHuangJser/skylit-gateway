name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (build, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same toolchain as the Dockerfile builder stage.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.1
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --all-targets

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

  frontend-adapter:
    name: Frontend adapter tests (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: validation
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: validation/package-lock.json

      - name: Install (no browser download)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci --no-audit --no-fund

      # The original third-party Skylit chunks are not committed, so the byte-level
      # patch replay test is skipped here; it runs locally with SKYLIT_ASSET_ARCHIVE.
      - name: Test
        run: npm test

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      # Proves the Dockerfile builds (and its in-image `cargo test`) without publishing.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: skylit-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
