[package]
name = "skylit-gateway"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
axum = "0.8"
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "fs", "io-util"] }
url = "2.5"

[dev-dependencies]
futures-util = "0.3"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
